name: Build

on:
  push:
    branches: [ "arena/01a042cd-morsecode1" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed by softprops/action-gh-release

jobs:
  shared-tests:
    name: Shared JVM tests (Phases 1-5, 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Run shared JVM tests
        run: |
          set +e
          ./gradlew :shared:jvmTest --stacktrace 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
             grep -E '^e: |error:|FAILURE:|Caused by:' gradle.log | head -60 | sed 's/^/::error::/'
          exit $rc
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-report
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  android-app:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-android-
      - name: Require release signing secrets
        env:
          KS: ${{ secrets.MORSECODE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::MORSECODE_KEYSTORE_BASE64 secret is not set; release-only APK build requires signing secrets."
            exit 1
          fi
      - name: Write release keystore
        run: echo "${{ secrets.MORSECODE_KEYSTORE_BASE64 }}" | base64 -d > morsecode-release.jks
      - name: Assemble release APK
        env:
          MORSECODE_KEYSTORE: ${{ github.workspace }}/morsecode-release.jks
          MORSECODE_KEY_ALIAS: ${{ secrets.MORSECODE_KEY_ALIAS }}
          MORSECODE_KEY_PASSWORD: ${{ secrets.MORSECODE_KEY_PASSWORD }}
          MORSECODE_KEYSTORE_PASSWORD: ${{ secrets.MORSECODE_STORE_PASSWORD }}
        run: |
          set +e
          ./gradlew :androidApp:assembleRelease --stacktrace 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
           grep -E '^e: |error:|FAILURE:|Caused by:' gradle.log | head -60 | sed 's/^/::error::/'
          exit $rc
      - name: Delete keystore from runner
        if: ${{ always() }}
        run: rm -f morsecode-release.jks
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop-app:
    name: Windows EXE installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-desktop-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-desktop-
      - name: Package Windows distribution
        shell: bash
        run: |
          set +e
          ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
            grep -E '^e: |error:|FAILURE:|Caused by:' gradle.log | head -60 | sed 's/^/::error::/'
          exit $rc
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer
          path: desktopApp/build/compose/binaries/main/**/*.exe
          if-no-files-found: warn
