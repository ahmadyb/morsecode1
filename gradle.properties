# ─────────────────────────────────────────────────────────────────────────────
# Section 0.3 — Gradle performance settings for constrained hardware.
# Target machine: mechanical HDD, 8 GB RAM, dual-core CPU.
# These values are mandated verbatim by the project spec. Do not raise
# org.gradle.jvmargs above 2560m on the 8 GB dev box: Android Studio's own
# heap cap (Section 0.4) is 2048–3072 MB and the two compete for the same RAM.
# ─────────────────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2560m
org.gradle.parallel=false
org.gradle.caching=true
kotlin.incremental=true
org.gradle.configuration-cache=true

# --- Non-spec, but required for a clean build on this toolchain ---
# AndroidX is a hard requirement of Media3 and the androidx.media fallback path.
android.useAndroidX=true
# Compose Multiplatform generates a lot of code; keep the Kotlin daemon inside
# the Gradle JVM budget rather than forking a second large JVM.
kotlin.daemon.jvmargs=-Xmx1536m
kotlin.native.ignoreDisabledTargets=true
# Never let Gradle silently reach for a different toolchain than the JBR 17
# bundled with Android Studio (Section 0).
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
# SQLDelight + Compose both use kapt-free K2 codegen; keep the old path off.
kapt.use.worker.api=false
