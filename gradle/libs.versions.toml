# ─────────────────────────────────────────────────────────────────────────────
# Morse Code — pinned dependency versions (Section 0 of the project spec).
#
# These are the EXACT versions the spec mandates. Do not bump one of these
# without also re-running the full JVM test suite, because the wire protocol
# in shared/commonMain/net is byte-level compatible only against the crypto
# and serialization behaviour these versions pin.
# ─────────────────────────────────────────────────────────────────────────────
[versions]
# --- Toolchain (Section 0) ---
agp = "8.7.2"
kotlin = "2.0.21"
compose-multiplatform = "1.7.0"

# --- KotlinX ---
coroutines = "1.9.0"
serialization = "1.7.3"
datetime = "0.6.1"

# --- Persistence / discovery / codecs ---
sqldelight = "2.0.2"
jmdns = "3.5.9"
zxing = "3.5.3"

# --- UI / media ---
coil3 = "3.0.4"
media3 = "1.4.1"
vlcj = "4.8.2"

# --- Embedded Web Connect server (Section H) ---
ktor = "2.3.12"

# --- AndroidX / platform ---
androidx-activity-compose = "1.9.3"
androidx-core = "1.13.1"
androidx-lifecycle = "2.8.7"
androidx-media = "1.7.0"          # MediaSessionCompat fallback path, API 23
coroutines-android = "1.9.0"

# --- Test ---
junit = "4.13.2"
kotlin-test = "2.0.21"

[libraries]
# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines-android" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# SQLDelight — one shared schema, driver supplied per platform
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# mDNS discovery — JVM-only artifact, declared in androidMain + desktopMain
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }

# QR encode/decode — JVM-only artifact, declared in androidMain + desktopMain
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# Coil 3 — genuinely multiplatform, safe in commonMain
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor2", version.ref = "coil3" }

# AndroidX Media3 (Android only)
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

# VLCJ (Desktop only — requires VLC installed on the host at runtime)
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }

# Ktor embedded server — runs as plain JVM code in commonMain on both platforms
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# AndroidX (androidApp wrapper module only)
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }

# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin-test" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-test" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
